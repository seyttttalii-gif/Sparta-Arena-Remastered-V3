
name: Sparta Arena Remastered V3 - Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Sparta Arena Remastered
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasini ac ve projeyi bul
        shell: pwsh
        run: |
          $zipFiles = @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "*.zip" -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
              Sort-Object -Property @{
                Expression = {
                  if ($_.Name -eq "SpartaArenaRemastered_BlackScreenFix_20261028.zip") { 0 }
                  elseif ($_.Name -match "BlackScreenFix") { 1 }
                  elseif ($_.Name -match "FullUpgrade") { 2 }
                  else { 3 }
                }
              }, FullName
          )

          if ($zipFiles.Count -eq 0) {
            throw "Depoda ZIP bulunamadi."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "SpartaArenaV3"

          if (Test-Path $extractRoot) {
            Remove-Item -Path $extractRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          $project = $null
          $index = 0

          foreach ($zip in $zipFiles) {
            $index++
            $target = Join-Path $extractRoot "archive_$index"

            Write-Host "ZIP aciliyor: $($zip.Name)"
            New-Item -ItemType Directory -Path $target -Force | Out-Null

            try {
              Expand-Archive -LiteralPath $zip.FullName -DestinationPath $target -Force

              $found = Get-ChildItem -Path $target -Filter "project.godot" -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object {
                  (Test-Path (Join-Path $_.Directory.FullName "scripts/game_root.gd")) -and
                  (Test-Path (Join-Path $_.Directory.FullName "export_presets.cfg")) -and
                  (Test-Path (Join-Path $_.Directory.FullName "scenes/main.tscn"))
                } |
                Select-Object -First 1

              if ($found) {
                $project = $found
                break
              }
            }
            catch {
              Write-Host "ZIP acma hatasi: $($_.Exception.Message)"
            }
          }

          if (-not $project) {
            throw "ZIP icinde gerekli Godot proje dosyalari bulunamadi."
          }

          $projectDir = $project.Directory.FullName
          Write-Host "Proje bulundu: $projectDir"
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Godot ve Windows export sablonlarini kur
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
          cache: false

      - name: Godot komutunu kontrol et
        shell: bash
        run: |
          echo "Godot komutu aranıyor..."
          command -v godot
          godot --headless --version

      - name: Projeyi ice aktar
        shell: bash
        run: |
          PROJECT_DIR_UNIX="$(cygpath -u "$PROJECT_DIR")"
          godot --headless --editor --path "$PROJECT_DIR_UNIX" --import --quit

      - name: Oyun acilis testi
        shell: bash
        run: |
          PROJECT_DIR_UNIX="$(cygpath -u "$PROJECT_DIR")"
          godot --headless --path "$PROJECT_DIR_UNIX" --quit-after 3

      - name: Windows EXE olustur
        shell: bash
        run: |
          PROJECT_DIR_UNIX="$(cygpath -u "$PROJECT_DIR")"
          WORKSPACE_UNIX="$(cygpath -u "$GITHUB_WORKSPACE")"

          mkdir -p "$WORKSPACE_UNIX/build"

          godot --headless \
            --path "$PROJECT_DIR_UNIX" \
            --export-release "Windows Desktop" \
            "$WORKSPACE_UNIX/build/SpartaArenaRemastered.exe"

          if [ ! -f "$WORKSPACE_UNIX/build/SpartaArenaRemastered.exe" ]; then
            echo "EXE dosyasi olusturulamadi."
            exit 1
          fi

          echo "EXE basariyla olusturuldu."

      - name: EXE dosyasini indirmeye hazirla
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-Remastered-V3-Windows
          path: build/SpartaArenaRemastered.exe
          if-no-files-found: error
